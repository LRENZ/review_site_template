<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Levi's review artwork</title>
  <desc id="desc">Editorial denim review artwork with jeans, stitching, rivets, and classic apparel cues.</desc>
  <defs>
    <linearGradient id="denim" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#07111f"/>
  <rect x="76" y="72" width="1048" height="756" rx="56" fill="url(#denim)"/>
  <path d="M112 150h976M112 228h976M112 306h976M112 384h976M112 462h976M112 540h976M112 618h976M112 696h976" stroke="#93c5fd" stroke-opacity="0.16" stroke-width="3"/>
  <path d="M180 102v690M298 102v690M416 102v690M534 102v690M652 102v690M770 102v690M888 102v690M1006 102v690" stroke="#93c5fd" stroke-opacity="0.12" stroke-width="3"/>
  <g filter="url(#shadow)">
    <rect x="160" y="146" width="880" height="608" rx="38" fill="url(#paper)"/>
    <rect x="226" y="210" width="280" height="420" rx="34" fill="#1e40af"/>
    <path d="M292 210l22 420M440 210l-22 420" stroke="#bfdbfe" stroke-width="10" stroke-linecap="round" opacity="0.72"/>
    <path d="M252 298h228M252 358h228" stroke="#dbeafe" stroke-width="10" stroke-linecap="round" opacity="0.62"/>
    <path d="M312 630h106" stroke="#facc15" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 18"/>
    <circle cx="284" cy="254" r="17" fill="#d97706"/>
    <circle cx="448" cy="254" r="17" fill="#d97706"/>
    <rect x="560" y="214" width="320" height="64" rx="18" fill="#b91c1c"/>
    <text x="590" y="257" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="900">LEVI'S REVIEW</text>
    <text x="560" y="342" fill="#0f172a" font-family="Arial, sans-serif" font-size="44" font-weight="900">Classic denim</text>
    <text x="560" y="392" fill="#334155" font-family="Arial, sans-serif" font-size="25">501 jeans, trucker jackets, tees,</text>
    <text x="560" y="428" fill="#334155" font-family="Arial, sans-serif" font-size="25">and everyday wardrobe staples.</text>
    <rect x="560" y="490" width="162" height="56" rx="18" fill="#dbeafe"/>
    <text x="590" y="526" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="23" font-weight="800">501 Fit</text>
    <rect x="742" y="490" width="190" height="56" rx="18" fill="#fee2e2"/>
    <text x="772" y="526" fill="#991b1b" font-family="Arial, sans-serif" font-size="23" font-weight="800">Trucker</text>
    <rect x="560" y="586" width="372" height="68" rx="24" fill="#0f172a"/>
    <text x="604" y="630" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="900">Shop the classics</text>
  </g>
</svg>
